name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-common patchelf desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zipover-cli") | .version')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version v$package_version"
              exit 1
            fi
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=${package_version%%[-+]*}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --workspace --release --target "${{ matrix.target }}"

      - name: Package and verify (DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="out/zipover-gui_${VERSION}_${{ matrix.target }}.dmg"
          scripts/macos-dmg.sh \
            "target/${{ matrix.target }}/release/zipover-gui" \
            "$dmg" "$BUNDLE_VERSION"
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rm -rf "$mount_point"
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null
          "$mount_point/Zipover.app/Contents/MacOS/zipover-gui" --version
          test -L "$mount_point/Applications"

      - name: Package and verify (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="zipover_${VERSION}_${{ matrix.target }}"
          rm -rf package verify
          mkdir -p "package/zipover" out verify
          cp "target/${{ matrix.target }}/release/zipover" "package/zipover/"
          cp README.md README.CN.md "package/zipover/"
          if [[ "${{ matrix.target }}" == *-apple-darwin ]]; then
            cp -R "out/Zipover.app" "package/zipover/"
          fi
          tar -C package -czf "out/${pkg}.tar.gz" zipover
          tar -xzf "out/${pkg}.tar.gz" -C verify
          "verify/zipover/zipover" --version
          if [[ "${{ matrix.target }}" == *-apple-darwin ]]; then
            test -x "verify/zipover/Zipover.app/Contents/MacOS/zipover-gui"
            test -f "verify/zipover/Zipover.app/Contents/Resources/zipover.icns"
          fi

      - name: Package and verify (portable EXE)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($binary in @("zipover", "zipover-gui")) {
            $source = "target\${{ matrix.target }}\release\$binary.exe"
            $destination = "out\${binary}_${env:VERSION}_${{ matrix.target }}.exe"
            Copy-Item $source $destination
            $process = Start-Process -FilePath (Resolve-Path $destination).Path -ArgumentList "--version" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "EXE smoke check failed: $destination" }
          }

      - name: Package and verify (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="out/zipover-gui_${VERSION}_${{ matrix.target }}.AppImage"
          scripts/linux-appimage.sh \
            "target/${{ matrix.target }}/release/zipover-gui" \
            "$appimage" "$BUNDLE_VERSION"
          "$appimage" --appimage-extract-and-run --version
          mkdir -p verify-appimage
          (cd verify-appimage && "../$appimage" --appimage-extract >/dev/null)
          test -x verify-appimage/squashfs-root/usr/bin/zipover-gui
          test -f verify-appimage/squashfs-root/zipover.desktop
          test -f verify-appimage/squashfs-root/zipover.png
          test -f verify-appimage/squashfs-root/usr/lib/libayatana-appindicator3.so.1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipover_${{ matrix.target }}
          if-no-files-found: error
          path: |
            out/*.tar.gz
            out/*.exe
            out/*.dmg
            out/*.AppImage

  publish:
    if: github.ref_type == 'tag'
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: artifacts
        run: sha256sum *.exe *.tar.gz *.dmg *.AppImage > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  notify:
    name: notify (${{ matrix.repository }})
    runs-on: ubuntu-latest
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: homebrew-tap
            token: HOMEBREW_TAP_TOKEN
          - repository: scoop-bucket
            token: SCOOP_BUCKET_TOKEN
    steps:
      - name: Dispatch release update
        env:
          GH_TOKEN: ${{ secrets[matrix.token] }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY_OWNER/${{ matrix.repository }}/dispatches" \
            -f event_type=tool-released \
            -f 'client_payload[tool]=zipover' \
            -f "client_payload[tag]=$GITHUB_REF_NAME" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY"
