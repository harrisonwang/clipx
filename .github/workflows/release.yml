name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-config:
    name: validate release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured" >&2
              exit 1
            fi
          done

  ci:
    name: ci
    needs: release-config
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [ci, release-config]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe_ext: ".exe"
          - runner: macos-latest
            target: aarch64-apple-darwin
            exe_ext: ""
          - runner: macos-latest
            target: x86_64-apple-darwin
            exe_ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package and verify (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="clipx_${VERSION}_${{ matrix.target }}"
          rm -rf package out verify
          mkdir -p "package/clipx" out verify
          cp "target/${{ matrix.target }}/release/clipx${{ matrix.exe_ext }}" "package/clipx/"
          cp README.md "package/clipx/"
          tar -C package -czf "out/${pkg}.tar.gz" clipx
          tar -xzf "out/${pkg}.tar.gz" -C verify
          test -x "verify/clipx/clipx${{ matrix.exe_ext }}"
          "verify/clipx/clipx${{ matrix.exe_ext }}" --version

      - name: Package and verify (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "clipx_${env:VERSION}_${{ matrix.target }}"
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force verify -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package\clipx | Out-Null
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\clipx${{ matrix.exe_ext }}" "package\clipx\clipx${{ matrix.exe_ext }}"
          Copy-Item "README.md" "package\clipx\README.md"
          Compress-Archive -Path "package\clipx" -DestinationPath "out\$pkg.zip" -Force
          Expand-Archive -Path "out\$pkg.zip" -DestinationPath verify -Force
          & "verify\clipx\clipx${{ matrix.exe_ext }}" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipx_${{ matrix.target }}
          path: |
            out/*.tar.gz
            out/*.zip

  publish:
    if: github.ref_type == 'tag'
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          files=( *.zip *.tar.gz )
          if ((${#files[@]} == 0)); then
            echo "no artifacts found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  notify-homebrew-tap:
    if: github.ref_type == 'tag'
    name: notify homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Dispatch to homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured" >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg tool "clipx" \
            --arg tag "$TAG" \
            --arg repo "$REPO" \
            '{event_type:"tool-released", client_payload:{tool:$tool, tag:$tag, repo:$repo}}')"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/harrisonwang/homebrew-tap/dispatches" \
            -d "$payload"

  notify-scoop-bucket:
    if: github.ref_type == 'tag'
    name: notify scoop bucket
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Dispatch to scoop-bucket
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "SCOOP_BUCKET_TOKEN is not configured" >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg tool "clipx" \
            --arg tag "$TAG" \
            --arg repo "$REPO" \
            '{event_type:"tool-released", client_payload:{tool:$tool, tag:$tag, repo:$repo}}')"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/harrisonwang/scoop-bucket/dispatches" \
            -d "$payload"
