[package]
name = "zipover-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zipover-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
zipover-core.workspace = true
hex.workspace = true
png.workspace = true
tao = "0.34"
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSNotification", "NSObjCRuntime", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSMenuItem", "NSApplication", "NSAlert", "NSBox", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSImage", "NSMenu", "NSPopUpButton", "NSResponder", "NSText", "NSTextField", "NSTextView", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libappindicator-sys = "0.9"

[build-dependencies]
embed-resource = "3.0.11"
